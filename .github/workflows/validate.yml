name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://woviachrgiqqoqrsxjuf.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_yoV-YtwjD5JFdu2-wfZ5QQ_7lXVrse0
      NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS: student.uniten.edu.my
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security check
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
